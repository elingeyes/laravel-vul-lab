name: Hack Auditor Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hack-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --prefer-dist

      - run: composer require mahdisphp/laravel-hack-auditor --dev --no-interaction

      - name: Setup environment
        run: cp .env.example .env && php artisan key:generate && php artisan migrate --force

      - name: Run Hack Auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HACK_AUDITOR_AI_PROVIDER: anthropic
          HACK_AUDITOR_AI_MODEL: claude-opus-4-6
        run: php artisan hack:scan --json --force --no-interaction --path=app/Http/Controllers/VulnController.php > .hack-auditor-results.json

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.hack-auditor-results.json', 'utf8'));
            const marker = '<!-- hack-auditor-report -->';
            const vulns = results.vulnerabilities || [];
            const score = results.overall_score;

            let body = marker + '\n';
            if (vulns.length === 0) {
              body += `## ✅ Hack Auditor Security Report\n\n**No vulnerabilities found** — Score: ${score}/100\n`;
            } else {
              body += `## 🔴 Hack Auditor Security Report\n\n`;
              body += `**Score:** ${score}/100 | **Findings:** ${vulns.length}\n\n`;
              body += `| Severity | Type | Line |\n|------|------|------|\n`;
              for (const v of vulns) {
                const icon = v.severity === 'critical' ? '🔴' : v.severity === 'high' ? '🟠' : v.severity === 'medium' ? '🟡' : '🔵';
                body += `| ${icon} ${v.severity_label} | ${v.type_label} | L${v.line} |\n`;
              }
              body += '\n';
              for (const v of vulns) {
                body += `<details><summary><strong>${v.severity_label}: ${v.type_label}</strong> (L${v.line})</summary>\n\n`;
                body += `**OWASP:** ${v.owasp}\n\n${v.description}\n\n`;
                if (v.fix) body += `**Fix:**\n\`\`\`php\n${v.fix}\n\`\`\`\n`;
                body += `</details>\n\n`;
              }
            }
            body += `\n---\n🔒 Scanned by [Laravel Hack Auditor](https://github.com/mahdi-salmanzade/laravel-hack-auditor)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }
