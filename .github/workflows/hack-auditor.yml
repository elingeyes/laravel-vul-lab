name: Hack Auditor Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hack-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --prefer-dist

      - run: composer require mahdisphp/laravel-hack-auditor --dev --no-interaction

      - name: Setup environment
        run: cp .env.example .env && php artisan key:generate && php artisan migrate --force

      - name: Run Hack Auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HACK_AUDITOR_AI_PROVIDER: anthropic
          HACK_AUDITOR_AI_MODEL: claude-opus-4-6
        run: php artisan hack:scan --json --force --no-interaction --path=app/Http/Controllers/VulnController.php | tee results.json

      - name: Show results
        run: cat results.json | jq .
