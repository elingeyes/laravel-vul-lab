name: Hack Auditor Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hack-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # composer.json pins mahdisphp/laravel-hack-auditor ^2.0, so this installs
      # the scanner too — no separate `composer require` step is needed.
      - run: composer install --no-interaction --prefer-dist

      - name: Setup environment
        run: cp .env.example .env && php artisan key:generate && php artisan migrate --force

      # Scope of this scan, precisely:
      #
      # The action always runs `hack:scan --json --diff`, so the AI pass sees the
      # PHP files CHANGED IN THIS PR against the base branch, intersected with the
      # configured scan paths (app/Http/Controllers, app/Models, app/Http/Requests,
      # app/Http/Middleware, routes). It is NOT a full-tree scan: no scan-path input
      # is set, so nothing is narrowed further than that, but a PR that touches no
      # PHP in those paths legitimately reports a clean score — that is the diff
      # scope talking, not a verdict on this repo, which is vulnerable by design.
      #
      # app/Policies is deliberately absent from the list above. It is not fed to
      # the AI pass; it is read as context by the DETERMINISTIC policy/route-mismatch
      # detector, which is how "policy defined but never applied" gets caught
      # reproducibly rather than by chance.
      #
      # Requires action v2.0.0 or newer: it consumes the v2 JSON contract and the
      # v1 tags do not emit it. GitHub resolves this ref during job setup, before
      # any step runs, so the tag must exist or the whole workflow errors out.
      - name: Run Hack Auditor
        uses: mahdi-salmanzade/laravel-hack-auditor-action@v2
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          provider: anthropic
          model: claude-opus-5
          install-package: 'false'
          # Findings are informational — every one of them is intentional here, so
          # no severity threshold should ever redden the check.
          fail-on: none
          # A BROKEN scan is different from a scan with findings, and must be loud.
          # fail-on-error defaults to 'true'; it is spelled out because this job
          # previously carried `continue-on-error: true`, which — with fail-on
          # already at none — masked nothing except a scan that failed to run
          # (bad API key, unbootable app, non-JSON output) and reported it green.
          # This repo exists to prove the scanner works; a silent no-op is the one
          # outcome worth failing on.
          fail-on-error: 'true'
